<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LokalConvert: Converter gambar, HEIC, PDF, audio, dan video 100% di browser. Privasi terjaga, target ukuran file otomatis, dan bisa dipakai offline."
    />
    <meta name="theme-color" content="#111113" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('lokalconvert:theme');
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          if (theme === 'light' || (!theme && prefersLight)) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>LokalConvert — Private File Converter</title>
  </head>
  <body class="bg-[#F4F2EC] text-[#141413] antialiased selection:bg-[#FF5416]/25 dark:bg-[#111113] dark:text-[#F3F2EE]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
